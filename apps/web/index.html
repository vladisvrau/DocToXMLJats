<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOCX to JATS XML</title>
    <meta name="description" content="Convert Word documents to JATS XML entirely in your browser. Nothing is uploaded." />
  </head>
  <body>
    <header>
      <div class="topbar">
        <h1 data-i18n="heading">DOCX → JATS XML</h1>
        <label class="lang">
          <span data-i18n="language">Language</span>
          <select id="lang"></select>
        </label>
      </div>
      <p class="lede" data-i18n="lede">Converted entirely on your device. Your document is never uploaded.</p>
    </header>

    <main>
      <label id="drop" class="drop" for="file">
        <strong data-i18n="dropStrong">Drop a .docx here</strong>
        <span data-i18n="dropRest">or click to choose</span>
        <input id="file" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
      </label>

      <div class="options">
        <label>
          <span data-i18n="variant">JATS variant</span>
          <select id="variant"></select>
        </label>
        <small id="variant-help"></small>
      </div>

      <div id="desktop-tools" class="row" hidden>
        <button id="open-native" type="button" data-i18n="open">Open…</button>
        <button id="batch" type="button" data-i18n="batch">Convert a folder…</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>

      <section id="result" hidden>
        <ul id="warnings" class="warnings"></ul>
        <div class="row">
          <button id="copy" type="button" data-i18n="copy">Copy XML</button>
          <button id="save" type="button" data-i18n="save">Download .xml</button>
        </div>
        <pre><code id="xml"></code></pre>
      </section>
    </main>

    <aside id="download" class="download">
      <h2 data-i18n="downloadHeading">Prefer a desktop app?</h2>
      <p data-i18n="downloadText">Same converter, plus batch folder conversion, “Open with” support and offline-only operation.</p>
      <a id="download-link" class="button" href="#"></a>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
